buildscript {
  ext.OtaSdk = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36,
    targetSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return OtaSdk[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

android {
  namespace "com.otasdk"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    targetSdkVersion getExtOrDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  implementation "com.facebook.react:react-android"

  // Networking — bundle downloader uses OkHttp
  implementation "com.squareup.okhttp3:okhttp:4.12.0"

  // Coroutines — all heavy work runs off the main thread
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

  // ZIP extraction uses java.util.zip (standard JDK) — no extra dep needed

  // ── Unit tests ────────────────────────────────────────────────────
  // These were missing entirely, so `./gradlew test` could not compile the
  // test source set at all — the existing tests had never been run.
  testImplementation "junit:junit:4.13.2"
  testImplementation "io.mockk:mockk:1.13.10"
  testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
}